# CI. Not active until this branch is pushed; nothing here deploys.
#
# Replay portability: the recorded model answers in tests/llm_cache are keyed
# by page images, which depend on the exact pdftoppm and Pillow that rendered
# them (docs/proposals/replay-portability.md). Ubuntu's Poppler is not the one
# that recorded the cache, so:
#   * the suite runs with DOCAGENT_REPLAY_ENV=skip — replay-dependent tests
#     (marker `replay`) are SKIPPED with a named reason and counted at the end
#     of the run; they never pass silently and never fail for that reason —
#     but an UNMARKED test raising ReplayEnvironmentError FAILS (tests/conftest.py);
#   * every action is pinned to a full commit SHA, its version in a comment;
#   * the accuracy harness runs only when the replay preflight passes, and the
#     job summary says which happened.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      DOCAGENT_TEST_NO_DOTENV: "1"
      DOCAGENT_REQUIRE_PG: "1"          # the PostgreSQL drift tests may not skip
      DOCAGENT_REPLAY_ENV: skip         # see the header
      OCR_WORKERS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # tests/test_run_c_adversarial.py reads pre-Run-C sources with
          # `git show 56e80ca:...`; a depth-1 clone does not have that commit
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: System packages (Tesseract eng+osd, Poppler, PostgreSQL binaries)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd poppler-utils postgresql
          # initdb / pg_ctl live outside PATH on Debian/Ubuntu
          ls -d /usr/lib/postgresql/*/bin | tail -1 >> "$GITHUB_PATH"
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1

      - name: Python dependencies (pinned by constraints.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt \
                      -c backend/constraints.txt

      - name: Replay preflight
        id: replay
        run: |
          if python -c "from tests.harness.llm_cache import CACHE_DIR, check_replay_environment as c; c(CACHE_DIR)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Replay preflight PASSED: this runner renders like the recording machine." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Replay preflight FAILED: replay-dependent tests are skipped (named) and the accuracy harness is not run. See docs/proposals/replay-portability.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Backend lint (project pyflakes gate)
        run: python -m pytest -q -p no:cacheprovider tests/test_no_undefined_names.py

      - name: Backend tests
        run: python -m pytest -q -ra --durations=20 -p no:cacheprovider --junitxml=backend-tests.xml

      - name: Accuracy harness (replay)
        if: steps.replay.outputs.ok == 'true'
        run: |
          python -m tests.harness.runner --mode replay
          python -m tests.harness.runner --mode replay --no-template

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: backend-test-report
          path: backend-tests.xml
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # production builds on node:20 (Dockerfile.frontend); the unit tests
          # use node --test with type stripping, which needs Node >= 22.18
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Frontend lint is intentionally skipped until the owner decides on an ESLint setup.
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.18"
      - name: Frontend tests
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee frontend-tests.txt
      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: frontend-test-report
          path: frontend/frontend-tests.txt
          if-no-files-found: warn

  contract-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      DOCAGENT_TEST_NO_DOTENV: "1"
      DOCAGENT_REPLAY_ENV: skip
      DOCAGENT_OFFLINE: "1"
      OCR_WORKERS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt
      - name: Local document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd poppler-utils
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt \
                      -c backend/constraints.txt
      - name: Contract tests T2-T5 (outbound network blocked by fixture)
        run: python -m pytest -q -p no:cacheprovider tests/acceptance --junitxml=contract-tests.xml
      - name: Recorded scoreboard
        run: python -m tests.tools.score_runs
      - name: Replay preflight
        id: replay
        run: |
          if python -c "from tests.harness.llm_cache import CACHE_DIR, check_replay_environment as c; c(CACHE_DIR)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Replay preflight passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Replay preflight did not match; replay harness skipped with a named reason." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Recorded replay harness
        if: steps.replay.outputs.ok == 'true'
        run: python -m tests.harness.runner --mode replay
      - name: Upload contract reports and scoreboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: contract-scoreboard-and-reports
          path: |
            contract-tests.xml
            tests/reports/acceptance/scoreboard.json
            tests/reports/acceptance/scoreboard.md
          if-no-files-found: warn

  # Run T2, Stage 4: OCR read by the SAME Tesseract release as production.
  # The Ubuntu runners carry another release, whose words can differ; this
  # job runs in the backend image's own base (same digest as
  # Dockerfile.backend) with the same pinned packages, refuses to run on any
  # other release, and runs the OCR tests there.
  ocr-pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: python:3.11.17-slim-bookworm@sha256:f06d01d4ba3f8ad5af45a3ec87df19c1d317d8e8961edc0fabda61811af6f7cf
    env:
      PYTHONIOENCODING: utf-8
      DOCAGENT_TEST_NO_DOTENV: "1"
      DOCAGENT_REPLAY_ENV: skip
      DOCAGENT_REQUIRE_TESSERACT_PIN: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Pinned system packages (as Dockerfile.backend)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libpq-dev poppler-utils \
            tesseract-ocr=5.3.0-2 libtesseract5=5.3.0-2 \
            tesseract-ocr-eng=1:4.1.0-2 tesseract-ocr-osd=1:4.1.0-2
          tesseract --version 2>&1 | head -1
          tesseract --version 2>&1 | head -1 | grep -q "tesseract 5.3.0" || { echo "Tesseract is not the pinned 5.3.0"; exit 1; }
      - name: Python dependencies (pinned by constraints.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt \
                      -c backend/constraints.txt
      - name: OCR tests on the pinned reader
        run: python -m pytest -q -p no:cacheprovider tests/test_t2_ocr.py tests/test_image_ocr.py
