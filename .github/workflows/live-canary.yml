name: live-canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  frozen-owner-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      DOCAGENT_TEST_NO_DOTENV: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash-lite
      LIVE_CANARY_MAX_CALLS: "14"
      OCR_WORKERS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt
      - name: Local document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd poppler-utils
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt \
                      -c backend/constraints.txt
      - name: Require owner-managed secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Create the repository secret GEMINI_API_KEY before running the live canary."
            exit 1
          fi
      - name: Run capped live canary
        run: >-
          python -m tests.tools.live_canary
          --max-calls "$LIVE_CANARY_MAX_CALLS"
          --output tests/reports/acceptance/live-canary.json
      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: live-canary-report
          path: tests/reports/acceptance/live-canary.json
          if-no-files-found: warn
