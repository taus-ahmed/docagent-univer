[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    known_bug: reproduces a known, unfixed production bug. These tests FAIL on purpose — they are the proof the harness can see the bug. Deselect with -m "not known_bug" to get the green baseline.
    live: makes real LLM API calls (costs money, needs GEMINI_API_KEY). Deselected by default via addopts; select with -m live.
addopts = -m "not live" --strict-markers -ra
norecursedirs = .git .venv node_modules frontend backend/storage backend/data
